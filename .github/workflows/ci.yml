name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect workspaces
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.probe.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          if [ -f engine/Cargo.toml ]; then echo "engine=true" >> "$GITHUB_OUTPUT"; else echo "engine=false" >> "$GITHUB_OUTPUT"; fi

  web:
    name: Web · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Upload build (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  engine:
    name: Engine · ${{ matrix.os }}
    needs: detect
    if: needs.detect.outputs.engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 01a-4: the golden guard reads expected.json and Cargo.lock at the base commit
      - name: Install pinned toolchain (matches rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Determinism lint
        shell: bash
        run: bash scripts/lint-determinism.sh
      - name: Format
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check
      - name: Clippy (native)
        run: cargo clippy --locked --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test (native, debug)
        run: cargo test --locked --manifest-path engine/Cargo.toml --workspace
      - name: Exhaustive properties (release)
        run: cargo test --locked --release --manifest-path engine/Cargo.toml -p engine-core -- --ignored exhaustive_
      - name: Clippy (wasm32)
        run: cargo clippy --locked --manifest-path engine/Cargo.toml -p engine-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wasm-pack 0.15.0
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      # wasm-pack 0.15.0 passes arguments after the crate path straight to `cargo test`
      # (src/test/mod.rs `cmd.args(extra_options)`); arguments after `--` would reach the test
      # runner instead.
      - name: Wasm unit tests (Sharma vectors inside wasm32)
        run: wasm-pack test --node engine/wasm --locked
      - name: Build wasm (nodejs, release)
        run: wasm-pack build engine/wasm --target nodejs --release -- --locked
      - name: Test (wasm == native)
        run: node --test "engine/wasm/test/*.test.mjs"
      - name: Golden test files present
        shell: bash
        run: |
          # The wasm glob step must not silently lose a test file (e.g. one left out of a commit).
          for f in engine/wasm/test/smoke.test.mjs engine/wasm/test/golden.test.mjs engine/wasm/test/cli_contract.test.mjs engine/golden/test/verify-sources.test.mjs; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Golden sources script tests
        run: node --test engine/golden/test/verify-sources.test.mjs
      - name: Golden sources intact
        run: node engine/golden/verify-sources.mjs
      - name: Golden processed fixture reproduces
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cargo run --locked --release --manifest-path engine/Cargo.toml -p engine-cli -- fixture --out-dir "$TMP" --width 512 --height 384
          node engine/golden/verify-sources.mjs --processed images/synthetic_512x384_baseline420.jpg "$TMP/fixture.jpg"
      - name: Golden (native, debug)
        run: cargo run --locked --manifest-path engine/Cargo.toml -p engine-cli -- golden check --dir engine/golden --actual-out engine/golden/actual-native-debug.json
      - name: Golden (native, release)
        run: cargo run --locked --manifest-path engine/Cargo.toml --release -p engine-cli -- golden check --dir engine/golden --actual-out engine/golden/actual-native-release.json
      - name: Golden version guard (vs base)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # New branch push: compare with the default branch.
            git fetch --no-tags origin main
            BASE=$(git merge-base origin/main HEAD)
          fi
          git cat-file -e "$BASE^{commit}" # unreachable base is an error, not a pass
          if git cat-file -e "$BASE:engine/golden/expected.json" 2>/dev/null; then
            git show "$BASE:engine/golden/expected.json" > "$RUNNER_TEMP/base-expected.json"
            git show "$BASE:engine/Cargo.lock" > "$RUNNER_TEMP/base-Cargo.lock"
            cargo run --locked --manifest-path engine/Cargo.toml --release -p engine-cli -- \
              golden guard --base "$RUNNER_TEMP/base-expected.json" --head engine/golden/expected.json \
              --base-lock "$RUNNER_TEMP/base-Cargo.lock" --head-lock engine/Cargo.lock
          else
            echo "expected.json does not exist at $BASE: first introduction, guard not applicable"
          fi
      - name: Upload golden failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-${{ matrix.os }}
          path: engine/golden/actual-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Cargo.lock unchanged
        shell: bash
        run: git diff --exit-code -- engine/Cargo.lock
